version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fraudgraph_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fraudgraph_db
    volumes:
      - mongodb_data:/data/db

  neo4j:
    image: neo4j:5-community
    container_name: fraudgraph_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudgraph_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=fraudgraph_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - mongodb
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudgraph_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
  neo4j_data:
